<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>My Interactive Dashboard</h1>
        <p>This dashboard was created by Patrick Price for the WEB-115 course at Wake Tech</p>
    </header>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
            <div class="col" id="weekly-tasks">
                <h2>Weekly Task Goals</h2>
                <form>
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </div>
                    <div>
                        <label for="daily-goal">Daily Task Goal:</label>
                        <input type="number" id="daily-goal" name="daily_goal">
                    </div>
                    <div>
                        <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                        <input type="number" id="bonus-tasks" name="bonus_tasks">
                    </div>
                    <button type="button" id="goal-btn">Submit</button>
                </form>
                <p id="goal-message"></p>
            </div>

            <!-- Imperial / Metric Converter -->
            <div class="col" id="metric-converter">
                <h2>Imperial / Metric Converter</h2>
                <form id="converter-form">
                    <div>
                        <label for="conversion-input">Value:</label>
                        <input type="number" id="conversion-input" step="any" placeholder="Enter number" required>
                    </div>
                    <div>
                        <label for="conversion-type">Conversion Type:</label>
                        <select id="conversion-type">
                            <option value="inch-to-cm">Inches to Centimeters</option>
                            <option value="cm-to-inch">Centimeters to Inches</option>
                            <option value="foot-to-m">Feet to Meters</option>
                            <option value="m-to-foot">Meters to Feet</option>
                            <option value="yard-to-m">Yards to Meters</option>
                            <option value="m-to-yard">Meters to Yards</option>
                            <option value="mile-to-km">Miles to Kilometers</option>
                            <option value="km-to-mile">Kilometers to Miles</option>
                        </select>
                    </div>
                    <button type="submit" id="convert-btn">Convert</button>
                </form>
                <div id="converter-output"></div>
                <script defer src="js/metric-converter.js"></script>
            </div>
        </div>
    </div>

    <!-- Script tag is now safely at the bottom after all HTML elements load -->
    <script src="js/task-manager.js"></script>
</body>
</html>
